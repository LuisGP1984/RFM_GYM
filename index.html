<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d0171f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RFM GYM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@1,700;1,800;1,900&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de app móvil (máx. 560px), cabecera fija. Colores cálidos del Excel (naranja ED7D31, melocotón F7CAAC/FBE4D5) y degradado amarillo-naranja-rojo del logo */
:root {
  --bg: #ffeee2; --surface: #ffffff; --ink: #2a1611; --muted: #7d5c50; --line: #f1d6c5; --soft: #fdf0e7; color-scheme: light;
  --b1: #d0171f; --b2: #ed7d31; --b3: #f9b522; --btn-ink: #ffffff; --focus: #c0141b;
  --p1: #c8161d; --p2: #e2481f; --p3: #ed7d31; --p4: #f3a824; --p-ink: #ffffff; --p4-ink: #2a1611;
  --danger: #a3121a; --ok: #ed7d31;
  --display: "Saira", "Arial Black", "Segoe UI", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, system-ui, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.topbar h1, .wk-label, .day h2, .chart h2, .sheet h2, .ed-day h2, .best b, .h-w, .plate, .step input { font-style: italic; }
.topbar { border-bottom: 3px solid transparent; border-image: linear-gradient(90deg, var(--b3), var(--b2), var(--b1)) 1; }
.wm { display: inline-flex; align-items: baseline; gap: .3em; font-weight: 900; font-size: 1.9rem; letter-spacing: -.01em; line-height: 1; padding-right: .15em; }
.wm b { font-weight: 900; background: linear-gradient(180deg, var(--b3) 5%, var(--b2) 45%, var(--b1) 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wm i { font-style: italic; color: var(--b1); font-size: .72em; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 8px; }
.topbar .titles { flex: 1; min-width: 0; }
.topbar h1 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1.05; margin: 0; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar p { margin: 0; color: var(--muted); font-size: .85rem; }
.menu { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 100%; margin-top: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 30px rgb(0 0 0 / .18); padding: 6px; display: grid; min-width: 230px; }
.menu button { text-align: left; background: none; border: 0; padding: 12px 14px; border-radius: 6px; }
.menu button:hover { background: var(--soft); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

#view { display: grid; gap: 14px; padding-top: 16px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 1.4rem; line-height: 1; display: inline-grid; place-items: center; flex: none; }
.icon-btn.sm { width: 34px; height: 34px; font-size: 1.05rem; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn.plain { border: 0; background: none; }
.btn { border-radius: 999px; padding: 10px 18px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.solid { background: linear-gradient(180deg, var(--b2), var(--b1)); color: var(--btn-ink); border-color: transparent; font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 14px; font-size: .9rem; }
.btn.wide { width: 100%; }
.link { background: none; border: 0; padding: 6px 0; color: var(--b1); font-weight: 600; text-align: left; }
.danger-t { color: var(--danger); }
.empty, .hint { color: var(--muted); font-size: .9rem; margin: 0; }
.stack { display: grid; gap: 10px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

.notice { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.notice p { margin: 0; font-size: .92rem; }

.app { position: relative; z-index: 1; }
.topbar { background: rgb(255 255 255 / .9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.day, .ex, .card, .chart, .hist, .wkchip { box-shadow: 0 2px 10px rgb(208 23 31 / .07); }
.msg { border-radius: 14px; padding: 14px 16px; background: linear-gradient(135deg, #fff6e0, #ffe6d6); border: 1px solid #f7caac; display: grid; gap: 4px; }
.msg h2 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 1.15rem; color: var(--b1); }
.msg p { margin: 0; font-size: .95rem; }
.msg ul { margin: 2px 0 0; padding-left: 18px; font-size: .92rem; }
.msg li b { font-variant-numeric: tabular-nums; color: var(--b1); }
.cheer { margin: 0; font-size: .9rem; font-weight: 600; color: var(--b1); }
.goal { color: var(--muted); font-size: .85rem; }
.goal b { color: var(--ink); font-variant-numeric: tabular-nums; }
.weekbar { display: flex; align-items: center; gap: 8px; }
.wk-mid { flex: 1; text-align: center; min-width: 0; }
.wk-rel { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--b1); }
.wk-label { font-family: var(--display); font-size: 1.75rem; line-height: 1.05; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wk-label span { font-weight: 700; font-size: .7em; color: var(--muted); text-transform: lowercase; }
.wk-label small { font-size: .62em; color: var(--muted); font-weight: 700; }

.strip-wrap { display: grid; gap: 6px; }
.strip-h { display: flex; align-items: baseline; gap: 8px; }
.strip-h span { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; font-size: .95rem; }
.strip-h small { color: var(--muted); font-size: .8rem; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.wkchip { flex: none; display: grid; justify-items: center; gap: 4px; min-width: 56px; padding: 8px 6px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.wkchip .d { font-size: .75rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.wkchip .dots { display: flex; gap: 3px; }
.wkchip .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--b2); }
.wkchip .dots i.f { background: var(--b1); border-color: var(--b1); }
.wkchip .x { font-size: .68rem; font-weight: 700; color: var(--b1); line-height: 1; min-height: .7rem; }
.wkchip.on { border-color: var(--b1); box-shadow: inset 0 0 0 1px var(--b1); background: var(--soft); }
.wkchip.on .d { color: var(--ink); }

.opts { display: grid; gap: 2px; }
.opts label { display: flex; gap: 10px; align-items: center; padding: 8px 4px; }
.opts input { accent-color: var(--b1); width: 18px; height: 18px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.plate { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--display); font-weight: 700; font-size: 1.3rem; color: var(--p-ink);
  box-shadow: inset 0 0 0 4px rgb(255 255 255 / .22), inset 0 0 0 11px rgb(0 0 0 / .08); }
.p1 { background: var(--p1); } .p2 { background: var(--p2); } .p3 { background: var(--p3); } .p4 { background: var(--p4); color: var(--p4-ink); }

.day { background: var(--surface); border-radius: 14px; padding: 14px; display: grid; gap: 10px; border: 1px solid var(--line); }
.day header { display: flex; gap: 12px; align-items: center; }
.day-t { flex: 1; min-width: 0; }
.day h2 { font-family: var(--display); font-size: 1.5rem; margin: 0; line-height: 1; text-transform: uppercase; }
.day-t p { margin: 2px 0 0; color: var(--muted); font-size: .82rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.state { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); flex: none; }
.state.ok { background: var(--ok); color: #2a1611; }
.sess { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--soft); border: 0; border-radius: 10px; padding: 12px 14px; text-align: left; font-weight: 600; }
.sess span:first-child { flex: 1; }
.sess .cnt { color: var(--muted); font-weight: 500; font-size: .9rem; font-variant-numeric: tabular-nums; }

.sess-meta { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.field > span { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.field input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; min-width: 0; width: 100%; }
.mini-step { display: flex; align-items: center; gap: 10px; }
.mini-step b { min-width: 2ch; text-align: center; font-size: 1.15rem; font-variant-numeric: tabular-nums; }

.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.ex header { display: flex; gap: 10px; align-items: start; justify-content: space-between; }
.ex h3 { margin: 0; font-size: 1.08rem; font-weight: 600; }
.target { margin: 0; color: var(--muted); font-size: .85rem; }
.target b { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.last { margin: 0; font-size: .9rem; color: var(--muted); }
.last span { font-variant-numeric: tabular-nums; }
.last b { color: var(--ink); font-variant-numeric: tabular-nums; }
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.step { display: flex; align-items: center; gap: 4px; min-width: 0; }
.step .icon-btn { width: 38px; height: 38px; font-size: 1.2rem; }
.step label { flex: 1; min-width: 0; position: relative; }
.step input { width: 100%; text-align: center; font-family: var(--display); font-size: 1.5rem; font-weight: 700; padding: 6px 2px 16px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--soft); font-variant-numeric: tabular-nums; }
.step input::placeholder { color: var(--muted); opacity: .55; }
.step label span { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); pointer-events: none; }
.ex footer { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ex textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); resize: vertical; }
@media (max-width: 360px) { .steps { grid-template-columns: 1fr; } }

.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.chart h2 { font-family: var(--display); text-transform: uppercase; font-size: 1.2rem; margin: 0 0 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-dasharray: 3 3; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.chart .area { fill: var(--b2); opacity: .12; }
.chart .line { fill: none; stroke: var(--b1); stroke-width: 2.5; stroke-linejoin: round; }
.chart .dot { fill: var(--b1); }

<script>
// ---- Exportación a Excel (.xlsx) sin librerías: zip "store" + XML ----
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipStore(files) { // files: [{name, data: Uint8Array}]
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, crc, true); h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + f.data.length;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  const all = [...parts, ...central, new Uint8Array(e.buffer)];
  const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
  let pos = 0;
  for (const p of all) { out.set(p, pos); pos += p.length; }
  return out;
}

const S = { TITLE: 1, HEADER: 2, EXERCISE: 3, CELL: 4, NOTE: 5, DATE: 6, NUM: 7, TEXT: 8, CELL_B: 9, NOTE_B: 10 };

function xmlEsc(s) {
  return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function colName(c) { let n = c + 1, s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function cellRef(r, c) { return colName(c) + (r + 1); }

function newSheet() { return { rows: new Map(), merges: [], widths: new Map() }; }
function setCell(sh, r, c, v, style, isNum) {
  if (!sh.rows.has(r)) sh.rows.set(r, new Map());
  sh.rows.get(r).set(c, { v, style, isNum: !!isNum });
}

function sheetXml(sh) {
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
  if (sh.widths.size) {
    x += '<cols>';
    [...sh.widths.keys()].sort((a, b) => a - b).forEach(c => { x += `<col min="${c + 1}" max="${c + 1}" width="${sh.widths.get(c)}" customWidth="1"/>`; });
    x += '</cols>';
  }
  x += '<sheetData>';
  [...sh.rows.keys()].sort((a, b) => a - b).forEach(r => {
    x += `<row r="${r + 1}">`;
    const cells = sh.rows.get(r);
    [...cells.keys()].sort((a, b) => a - b).forEach(c => {
      const cell = cells.get(c);
      const ref = cellRef(r, c);
      if (cell.isNum) x += `<c r="${ref}" s="${cell.style}"><v>${cell.v}</v></c>`;
      else if (cell.v === '' || cell.v == null) x += `<c r="${ref}" s="${cell.style}"/>`;
      else x += `<c r="${ref}" s="${cell.style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(cell.v)}</t></is></c>`;
    });
    x += '</row>';
  });
  x += '</sheetData>';
  if (sh.merges.length) x += `<mergeCells count="${sh.merges.length}">` + sh.merges.map(m => `<mergeCell ref="${m}"/>`).join('') + '</mergeCells>';
  return x + '</worksheet>';
}

function buildTabla(data, weeks, h) {
  // weeks: lista de lunes 'YYYY-MM-DD'; h: { fmtEntry, fullName, mondayOf, weekLabel }
  const sh = newSheet();
  const per = 4, n = weeks.length;
  const groups = Math.max(1, Math.ceil(n / per)), gw = per + 3;
  for (let g = 0; g < groups; g++) {
    const b = g * gw;
    sh.widths.set(b, 30); for (let k = 1; k <= per; k++) sh.widths.set(b + k, 16);
    sh.widths.set(b + per + 1, 24); sh.widths.set(b + per + 2, 3);
  }
  const title = n ? `RFM GYM · semanas del ${h.weekLabel(weeks[0]).split(' – ')[0]} al ${h.weekLabel(weeks[n - 1]).split(' – ')[1]}` : 'RFM GYM';
  setCell(sh, 0, 0, title, S.TITLE);
  const byKey = new Map(); // "dayId|lunes" -> sesiones ordenadas
  for (const s of data.sessions) {
    const k = s.dayId + '|' + h.mondayOf(s.date);
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(s);
  }
  byKey.forEach(list => list.sort((x, y) => x.date.localeCompare(y.date)));
  let row = 2;
  for (const day of data.program.days) {
    const hr = row;
    for (let g = 0; g < groups; g++) {
      const b = g * gw, nc = b + per + 1;
      setCell(sh, hr, b, day.name, S.HEADER); setCell(sh, hr + 1, b, '', S.HEADER);
      sh.merges.push(`${cellRef(hr, b)}:${cellRef(hr + 1, b)}`);
      for (let k = 1; k <= per; k++) {
        const w = weeks[g * per + k - 1];
        if (w) { setCell(sh, hr, b + k, h.weekLabel(w), S.HEADER); setCell(sh, hr + 1, b + k, 'KG × REPS', S.HEADER); }
      }
      setCell(sh, hr, nc, 'notas', S.HEADER); setCell(sh, hr + 1, nc, '', S.HEADER);
      sh.merges.push(`${cellRef(hr, nc)}:${cellRef(hr + 1, nc)}`);
      setCell(sh, hr + 2, b, 'ejercicios', S.EXERCISE);
      for (let k = 1; k <= per + 1; k++) setCell(sh, hr + 2, b + k, '', k <= per ? S.CELL : S.NOTE);
    }
    let r = hr + 3;
    for (const [ei, ex] of day.exercises.entries()) {
      const cs = ei % 2 === 0 ? S.CELL_B : S.CELL, ns = ei % 2 === 0 ? S.NOTE_B : S.NOTE;
      for (let g = 0; g < groups; g++) {
        const b = g * gw, notes = [];
        setCell(sh, r, b, h.fullName(ex), S.EXERCISE);
        for (let k = 1; k <= per; k++) {
          const w = weeks[g * per + k - 1];
          if (!w) { setCell(sh, r, b + k, '', cs); continue; }
          const sess = byKey.get(day.id + '|' + w) || [];
          const entries = sess.map(s => ({ s, e: s.entries[ex.id] })).filter(x => x.e);
          setCell(sh, r, b + k, entries.map(x => h.fmtEntry(x.e)).filter(Boolean).join(' / '), cs);
          entries.forEach(x => { if (x.e.note && x.e.note.trim()) notes.push(`${x.s.date.slice(8, 10)}/${x.s.date.slice(5, 7)}: ${x.e.note.trim()}`); });
        }
        setCell(sh, r, b + per + 1, notes.join('; '), ns);
      }
      r++;
    }
    row = r + 2;
  }
  return sh;
}

function buildDatos(data, weeks, h) {
  const sh = newSheet();
  ['Fecha', 'Semana', 'Día', 'Ejercicio', 'Kg', 'Reps', 'Nota'].forEach((t, i) => setCell(sh, 0, i, t, S.HEADER));
  [12, 20, 12, 34, 8, 8, 40].forEach((w, i) => sh.widths.set(i, w));
  const inRange = new Set(weeks);
  const days = new Map(data.program.days.map(d => [d.id, d]));
  let r = 1;
  const sessions = data.sessions.filter(s => inRange.has(h.mondayOf(s.date))).sort((a, b) => a.date.localeCompare(b.date));
  for (const s of sessions) {
    const day = days.get(s.dayId);
    const order = day ? day.exercises.map(e => e.id) : [];
    const ids = Object.keys(s.entries).sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib);
    });
    for (const id of ids) {
      const e = s.entries[id];
      if (!e || (e.kg == null && e.reps == null && !(e.note || '').trim())) continue;
      const ex = day && day.exercises.find(x => x.id === id);
      const [y, m, d] = s.date.split('-').map(Number);
      setCell(sh, r, 0, Date.UTC(y, m - 1, d) / 864e5 + 25569, S.DATE, true);
      setCell(sh, r, 1, h.weekLabel(h.mondayOf(s.date)), S.TEXT);
      setCell(sh, r, 2, day ? day.name : s.dayName, S.TEXT);
      setCell(sh, r, 3, ex ? h.fullName(ex) : (e.exerciseName || ''), S.TEXT);
      if (e.kg != null) setCell(sh, r, 4, e.kg, S.NUM, true); else setCell(sh, r, 4, '', S.TEXT);
      if (e.reps != null) setCell(sh, r, 5, e.reps, S.NUM, true); else setCell(sh, r, 5, '', S.TEXT);
      setCell(sh, r, 6, e.note || '', S.TEXT);
      r++;
    }
  }
  return sh;
}

const XLSX_STATIC = {
  '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
  '_rels/.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
  'xl/workbook.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Tabla" sheetId="1" r:id="rId1"/><sheet name="Datos" sheetId="2" r:id="rId2"/></sheets></workbook>',
  'xl/_rels/workbook.xml.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
  'xl/styles.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFED7D31"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF7CAAC"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFBE4D5"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="11"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyBorder="1" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyBorder="1" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyBorder="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyBorder="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="14" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyNumberFormat="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/><xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyBorder="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyBorder="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'
};

function buildXlsx(data, weeks, h) {
  const enc = new TextEncoder();
  const files = Object.entries(XLSX_STATIC).map(([name, xml]) => ({ name, data: enc.encode(xml) }));
  files.push({ name: 'xl/worksheets/sheet1.xml', data: enc.encode(sheetXml(buildTabla(data, weeks, h))) });
  files.push({ name: 'xl/worksheets/sheet2.xml', data: enc.encode(sheetXml(buildDatos(data, weeks, h))) });
  return zipStore(files);
}

<script>
// ================== Fechas ==================
const KEY = 'rfmgym.v2';
const FIRST_WEEK = '2026-11-02'; // primera semana de la app (lunes)
const WD = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function dnum(s) { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }
function dstr(n) { return new Date(n * 864e5).toISOString().slice(0, 10); }
function todayStr() { const t = new Date(); return dstr(Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / 864e5)); }
function dow(s) { return (new Date(dnum(s) * 864e5).getUTCDay() + 6) % 7; }
function mondayOf(s) { return dstr(dnum(s) - dow(s)); }
function addDays(s, n) { return dstr(dnum(s) + n); }
function fmtShort(s) { const [, m, d] = s.split('-'); return `${d}/${m}`; }
function fmtDate(s) { const [y, m, d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; }
function fmtDay(s) { return `${WD[dow(s)]} ${fmtShort(s)}`; }
function fmtLong(s) { return `${WD[dow(s)]} ${fmtDate(s)}`; }
/** "10/11 – 16/11/26" */
function weekLabel(mon) { return `${fmtShort(mon)} – ${fmtDate(addDays(mon, 6))}`; }
function weekRel(mon) {
  const diff = Math.round((dnum(mondayOf(todayStr())) - dnum(mon)) / 7);
  if (diff === 0) return 'Esta semana';
  if (diff === 1) return 'Semana pasada';
  if (diff > 1) return `Hace ${diff} semanas`;
  return diff === -1 ? 'Próxima semana' : `Dentro de ${-diff} semanas`;
}
function weeksBetween(fromMon, toMon) { const out = []; for (let m = fromMon; m <= toMon; m = addDays(m, 7)) out.push(m); return out; }

// ================== Formato ==================
function fmtKg(n) { const r = Math.round(n * 100) / 100; return String(r).replace('.', ','); }
function parseKg(t) { t = String(t).trim().replace(',', '.'); if (!t) return null; const n = Number(t); return isFinite(n) && n >= 0 ? n : null; }
function parseReps(t) { t = String(t).trim(); if (!/^\d+$/.test(t)) return null; return parseInt(t, 10); }
function fmtEntry(e) {
  if (!e) return '';
  const kg = e.kg != null ? fmtKg(e.kg) + ' kg' : null;
  if (kg && e.reps != null) return `${kg} × ${e.reps}`;
  if (kg) return kg;
  if (e.reps != null) return `${e.reps} rep`;
  return '';
}
function fullName(ex) { return ex.target ? `${ex.name} ${ex.target}` : ex.name; }
function hasValues(e) { return !!e && (e.kg != null || e.reps != null); }
function hasData(e) { return hasValues(e) || !!(e && e.note && e.note.trim()); }

// ================== Rutina por defecto (la del Excel) ==================
function parseEx(id, full) {
  const m = full.trim().match(/^(.*?)\s+(\d+(?:x\d+)*)$/);
  return m ? { id, name: m[1], target: m[2], stepKg: 2.5 } : { id, name: full.trim(), target: '', stepKg: 2.5 };
}
function defaultDays() {
  const src = [
    ['Día 1', ['Prensa horizontal 12x12x10', 'Sentadilla 12x10x10', 'Sentadilla búlgara 10', 'Step Ups 10', 'Sentadilla goblet 12', 'Abducción 15']],
    ['Día 2', ['Press hombros manc 12x10x10', 'Elev laterales 15x12x12', 'Dominadas 12x10x10', 'Remo polea 15x12x10', 'Superserie Curl biceps 15', 'Superserie Commandos']],
    ['Día 3', ['Sentadilla Smith 12x10x10', 'Peso muerto barra 10', 'Hip thrust 12x10x10', 'Sentadilla sumo step 15', 'Zancada trasera 12', 'Femoral maquina 15x12x12']],
    ['Día 4', ['Remo barra 12', 'Press pecho mancuernas 12', 'Jalón al pecho 12x10x10', 'Deltoides posterior maq 15', 'Face pulls 12', 'Extensión triceps polea 15']],
  ];
  return src.map(([name, list], i) => ({ id: `d${i + 1}`, name, exercises: list.map((f, j) => parseEx(`d${i + 1}e${j + 1}`, f)) }));
}
function emptyData() { return { version: 2, program: { days: defaultDays() }, sessions: [] }; }

/** Acepta copias antiguas (con nº de semana): la semana sale siempre de la fecha. */
function normalize(d) {
  if (!d || !d.program || !Array.isArray(d.program.days) || !Array.isArray(d.sessions)) throw new Error('formato');
  return {
    version: 2,
    program: { days: d.program.days },
    sessions: d.sessions.filter(s => s && /^\d{4}-\d{2}-\d{2}$/.test(s.date)).map(s => ({
      id: s.id || uid(), date: s.date, dayId: s.dayId, dayName: s.dayName || '', entries: s.entries || {},
    })),
  };
}

let storageOk = true;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); }
  catch (e) { storageOk = false; }
  return null;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); storageOk = true; }
  catch (e) { storageOk = false; }
}

try { localStorage.removeItem('sobrecarga.v1'); } catch (e) { /* sin almacenamiento */ }
let data = load();
if (!data) { data = emptyData(); save(); }

// ================== Estado ==================
const nav = [{ v: 'home' }];
let selMon = mondayOf(todayStr());
const noteOpen = new Set();

function currentMon() { return mondayOf(todayStr()); }
function firstMon() {
  const earliest = data.sessions.reduce((m, s) => (s.date < m ? s.date : m), FIRST_WEEK);
  return mondayOf(earliest);
}
function lastMon() {
  const latest = data.sessions.reduce((m, s) => (s.date > m ? s.date : m), todayStr());
  return mondayOf(latest);
}
function curView() { return nav[nav.length - 1]; }
function go(v) { nav.push(v); render(true); }
function back() { if (nav.length > 1) nav.pop(); render(true); }
function dayById(id) { return data.program.days.find(d => d.id === id); }
function sessionById(id) { return data.sessions.find(s => s.id === id); }
function allExercises() { return data.program.days.flatMap(d => d.exercises); }
function sessionsOfWeek(mon) { return data.sessions.filter(s => mondayOf(s.date) === mon); }

function lastBefore(exId, s) {
  let best = null;
  for (const o of data.sessions) {
    if (o.id === s.id || o.date > s.date) continue;
    const e = o.entries[exId];
    if (!hasValues(e)) continue;
    if (!best || o.date > best.s.date) best = { s: o, e };
  }
  return best;
}
function history(exId) {
  return data.sessions.filter(s => hasData(s.entries[exId])).map(s => ({ s, e: s.entries[exId] }))
    .sort((a, b) => b.s.date.localeCompare(a.s.date));
}

/** Mejora respecto a la vez anterior: "+1 kg", "+2 rep" o null. */
function improvement(e, last) {
  if (!hasValues(e) || !last) return null;
  if (e.kg != null && last.kg != null) {
    if (e.kg > last.kg) return `+${fmtKg(Math.round((e.kg - last.kg) * 100) / 100)} kg`;
    if (e.kg < last.kg) return null;
  }
  if (e.reps != null && last.reps != null && e.reps > last.reps && (e.kg == null || last.kg == null || e.kg === last.kg)) return `+${e.reps - last.reps} rep`;
  return null;
}
function challenge(last) {
  if (!last) return '';
  if (last.kg != null && last.reps != null) return `${fmtKg(last.kg)} kg × ${last.reps + 1}`;
  if (last.reps != null) return `${last.reps + 1} rep`;
  return '';
}
function nextPendingDay() {
  const done = new Set(sessionsOfWeek(currentMon()).map(s => s.dayId));
  return data.program.days.find(d => !done.has(d.id));
}
function homeMessage() {
  const today = todayStr();
  if (!data.sessions.length) {
    return `<section class="msg"><h2>¡Bienvenido!</h2><p>Empieza un día y apunta lo que levantes. La próxima vez te diré si has mejorado.</p></section>`;
  }
  const since = addDays(today, -6);
  const ups = [];
  for (const s of data.sessions.filter(x => x.date >= since).sort((a, b) => b.date.localeCompare(a.date))) {
    const day = dayById(s.dayId); if (!day) continue;
    for (const ex of day.exercises) {
      const prev = lastBefore(ex.id, s);
      const up = improvement(s.entries[ex.id], prev && prev.e);
      if (up) ups.push({ name: ex.name, up, date: s.date });
    }
  }
  const lastDate = data.sessions.reduce((m, s) => (s.date > m ? s.date : m), '0000-00-00');
  const idle = Math.round((dnum(today) - dnum(lastDate)) / 1);
  const next = nextPendingDay();
  const doneWeek = new Set(sessionsOfWeek(currentMon()).map(s => s.dayId)).size;
  const total = data.program.days.length;
  if (idle >= 4) {
    return `<section class="msg"><h2>¡Te echamos de menos!</h2><p>Llevas ${idle} días sin entrenar.${next ? ` Hoy es buen día para el <b>${esc(next.name)}</b>.` : ''}</p></section>`;
  }
  if (ups.length) {
    const list = ups.slice(0, 3).map(u => `<li>${esc(u.name)}: <b>${u.up}</b> <span class="goal">(${fmtDay(u.date)})</span></li>`).join('');
    const more = ups.length > 3 ? `<p class="goal">y ${ups.length - 3} más.</p>` : '';
    return `<section class="msg"><h2>¡Vas mejorando!</h2><p>En los últimos 7 días has superado tu marca en ${ups.length} ${ups.length === 1 ? 'ejercicio' : 'ejercicios'}:</p><ul>${list}</ul>${more}</section>`;
  }
  if (doneWeek >= total && total) {
    return `<section class="msg"><h2>¡Semana completa!</h2><p>Has hecho los ${total} días de esta semana. Buen trabajo.</p></section>`;
  }
  return `<section class="msg"><h2>¡A por ello!</h2><p>Esta semana llevas ${doneWeek} de ${total} días.${next ? ` El siguiente: <b>${esc(next.name)}</b>. Intenta subir 1 repetición o un poco de peso respecto a la última vez.` : ''}</p></section>`;
}
function cheerText(e, last) {
  const up = improvement(e, last && last.e);
  return up ? `▲ ${up} respecto al ${fmtDay(last.s.date)}. ¡Muy bien!` : '';
}

// ================== Utilidades UI ==================
const $ = (sel) => document.querySelector(sel);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function plateClass(day) { const i = data.program.days.indexOf(day); return 'plate p' + ((i < 0 ? 0 : i) % 4 + 1); }
function plateNum(day) { const m = day.name.match(/\d+/); return m ? m[0] : day.name.slice(0, 1); }

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

function modal({ title, body = '', confirm = 'Aceptar', danger = false, onConfirm }) {
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">${esc(title)}</h2><div class="sheet-body">${body}</div>
    <div class="sheet-actions"><button type="button" class="btn ghost" data-m="cancel">Cancelar</button>
    <button type="button" class="btn ${danger ? 'danger' : 'solid'}" data-m="ok">${esc(confirm)}</button></div></div>`;
  m.hidden = false;
  const first = m.querySelector('input[type="text"], input:not([type]), textarea'); (first || m.querySelector('[data-m="ok"]')).focus();
  m.onclick = (ev) => {
    const b = ev.target.closest('[data-m]');
    if (ev.target === m || (b && b.dataset.m === 'cancel')) { m.hidden = true; return; }
    if (b && b.dataset.m === 'ok') { if (onConfirm(m) !== false) m.hidden = true; }
  };
}

function download(name, bytes, mime) {
  const blob = new Blob([bytes], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// ================== Render ==================
function render(scrollTop) {
  const v = curView();
  $('#back').hidden = nav.length === 1;
  $('#menuBtn').hidden = v.v !== 'home';
  $('#delSession').hidden = v.v !== 'session';
  $('#menu').hidden = true;
  let html = '';
  if (v.v === 'home') html = renderHome();
  else if (v.v === 'session') html = renderSession(v.id);
  else if (v.v === 'history') html = renderHistory(v.id);
  else if (v.v === 'editor') html = renderEditor();
  $('#view').innerHTML = html;
  $('#storageWarn').hidden = storageOk;
  const strip = $('#strip'); if (strip) { const on = strip.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' }); }
  if (scrollTop) window.scrollTo(0, 0);
}

function setHeader(title, sub, brand) {
  if (brand) $('#hTitle').innerHTML = '<span class="wm" aria-label="RFM GYM"><b>RFM</b><i>GYM</i></span>';
  else $('#hTitle').textContent = title;
  $('#hSub').textContent = sub || '';
}

function renderStrip() {
  const days = data.program.days.length || 4;
  const weeks = weeksBetween(firstMon(), lastMon());
  return `<section class="strip-wrap" aria-label="Constancia por semana"><div class="strip-h"><span>Constancia</span><small>días hechos por semana</small></div>
    <div class="strip" id="strip">${weeks.map(mon => {
      const ss = sessionsOfWeek(mon);
      const done = new Set(ss.map(s => s.dayId)).size;
      const extra = Math.max(0, ss.length - done);
      const dots = Array.from({ length: days }, (_, i) => `<i class="${i < done ? 'f' : ''}"></i>`).join('');
      return `<button class="wkchip ${mon === selMon ? 'on' : ''}" data-act="pickWeek" data-mon="${mon}" aria-label="Semana del ${weekLabel(mon)}: ${done} de ${days} días">
        <span class="d">${fmtShort(mon)}</span><span class="dots">${dots}</span><span class="x">${extra ? '+' + extra : '&nbsp;'}</span></button>`;
    }).join('')}</div></section>`;
}

function renderHome() {
  const cur = currentMon();
  setHeader('RFM GYM', '', true);
  const sun = addDays(selMon, 6);
  let h = homeMessage() + `<section class="weekbar" aria-label="Semana">
    <button class="icon-btn" data-act="wk" data-d="-7" ${selMon <= firstMon() ? 'disabled' : ''} aria-label="Semana anterior">‹</button>
    <div class="wk-mid"><div class="wk-rel">${weekRel(selMon)}</div>
      <div class="wk-label">${fmtShort(selMon)} <span>al</span> ${fmtShort(sun)}<small>/${sun.slice(2, 4)}</small></div>
      ${selMon !== cur ? `<button class="link" data-act="wkNow">Ir a esta semana</button>` : ''}</div>
    <button class="icon-btn" data-act="wk" data-d="7" ${selMon >= lastMon() ? 'disabled' : ''} aria-label="Semana siguiente">›</button>
  </section>`;
  h += renderStrip();
  if (!data.program.days.length) h += `<p class="empty">No hay días en la rutina. Añádelos en Menú › Editar rutina.</p>`;
  for (const day of data.program.days) {
    const ss = sessionsOfWeek(selMon).filter(s => s.dayId === day.id).sort((a, b) => a.date.localeCompare(b.date));
    h += `<article class="day">
      <header><span class="${plateClass(day)}">${esc(plateNum(day))}</span>
        <div class="day-t"><h2>${esc(day.name)}</h2><p>${esc(day.exercises.map(e => e.name).join(' · '))}</p></div>
        <span class="state ${ss.length ? 'ok' : ''}">${ss.length ? 'Hecho' : 'Pendiente'}</span></header>`;
    for (const s of ss) {
      const n = day.exercises.filter(e => hasValues(s.entries[e.id])).length;
      h += `<button class="sess" data-act="open" data-id="${s.id}"><span>${fmtDay(s.date)}</span><span class="cnt">${n}/${day.exercises.length} apuntados</span><span aria-hidden="true">›</span></button>`;
    }
    h += ss.length
      ? `<button class="link" data-act="start" data-id="${day.id}">+ Repetir este día esta semana</button>`
      : `<button class="btn solid wide" data-act="start" data-id="${day.id}">Empezar ${esc(day.name)}</button>`;
    h += `</article>`;
  }
  return h;
}

function renderSession(id) {
  const s = sessionById(id);
  if (!s) { nav.pop(); return renderHome(); }
  const day = dayById(s.dayId);
  const mon = mondayOf(s.date);
  setHeader(day ? day.name : s.dayName, `${fmtLong(s.date)} · semana del ${weekLabel(mon)}`);
  const exs = day ? day.exercises : [];
  let h = `<section class="sess-meta">
    <label class="field"><span>Fecha del entrenamiento</span><input type="date" id="sDate" value="${s.date}"></label>
    <p class="hint">Si cambias la fecha, la sesión pasa a su semana.</p>
  </section>`;
  if (!exs.length) h += `<p class="empty">Este día no tiene ejercicios. Añádelos en Editar rutina.</p>`;
  for (const ex of exs) {
    const e = s.entries[ex.id] || {};
    const last = lastBefore(ex.id, s);
    const showNote = noteOpen.has(s.id + ex.id) || !!(e.note && e.note.trim());
    h += `<article class="ex" data-ex="${ex.id}">
      <header><div><h3>${esc(ex.name)}</h3>${ex.target ? `<p class="target">Objetivo <b>${esc(ex.target)}</b></p>` : ''}</div>
        <button class="link" data-act="hist" data-id="${ex.id}">Histórico</button></header>
      <p class="last">${last ? `Última vez <span>${fmtDay(last.s.date)}</span> <b>${esc(fmtEntry(last.e))}</b>` : 'Sin registros anteriores'}${challenge(last && last.e) ? `<br><span class="goal">Reto de hoy: <b>${esc(challenge(last.e))}</b></span>` : ''}</p>
      <p class="cheer" id="cheer-${ex.id}" ${cheerText(e, last) ? '' : 'hidden'}>${esc(cheerText(e, last))}</p>
      <div class="steps">
        <div class="step"><button class="icon-btn" data-act="dec" data-f="kg" aria-label="Menos kg">−</button>
          <label><input id="kg-${ex.id}" data-f="kg" inputmode="decimal" autocomplete="off" value="${e.kg != null ? fmtKg(e.kg) : ''}" placeholder="${last && last.e.kg != null ? fmtKg(last.e.kg) : '—'}"><span>kg</span></label>
          <button class="icon-btn" data-act="inc" data-f="kg" aria-label="Más kg">+</button></div>
        <div class="step"><button class="icon-btn" data-act="dec" data-f="reps" aria-label="Menos repeticiones">−</button>
          <label><input id="reps-${ex.id}" data-f="reps" inputmode="numeric" autocomplete="off" value="${e.reps != null ? e.reps : ''}" placeholder="${last && last.e.reps != null ? last.e.reps : '—'}"><span>reps</span></label>
          <button class="icon-btn" data-act="inc" data-f="reps" aria-label="Más repeticiones">+</button></div>
      </div>
      <footer>${hasValues(last && last.e) ? `<button class="link" data-act="repeat">Repetir lo de la última vez</button>` : '<span></span>'}
        <button class="link" data-act="note">${showNote ? 'Ocultar nota' : 'Añadir nota'}</button></footer>
      <textarea id="note-${ex.id}" data-f="note" rows="2" placeholder="Nota (unilateral, asistida…)" ${showNote ? '' : 'hidden'}>${esc(e.note || '')}</textarea>
    </article>`;
  }
  h += `<p class="hint">Se guarda solo. Puedes apuntar solo kg, solo repeticiones o ambos.</p>`;
  return h;
}

function renderHistory(exId) {
  const ex = allExercises().find(e => e.id === exId);
  const items = history(exId);
  setHeader(ex ? ex.name : (items[0] ? items[0].e.exerciseName : 'Ejercicio'), ex && ex.target ? `Objetivo ${ex.target}` : 'Histórico');
  if (!items.length) return `<p class="empty">Todavía no hay nada apuntado en este ejercicio.</p>`;
  const kgs = items.slice().reverse().filter(i => i.e.kg != null);
  let h = '';
  if (kgs.length >= 2) h += `<section class="chart"><h2>Evolución de kg</h2>${chartSvg(kgs)}</section>`;
  const best = items.filter(i => i.e.kg != null).sort((a, b) => b.e.kg - a.e.kg || (b.e.reps || 0) - (a.e.reps || 0))[0];
  if (best) h += `<p class="best">Mejor marca <b>${esc(fmtEntry(best.e))}</b> · ${fmtDate(best.s.date)}</p>`;
  h += `<ol class="hist">` + items.map(i => {
    const day = dayById(i.s.dayId);
    return `<li><button data-act="open" data-id="${i.s.id}"><span class="h-w">${fmtShort(i.s.date)}</span>
      <span class="h-d">${WD[dow(i.s.date)]} · semana del ${weekLabel(mondayOf(i.s.date))}${day ? ' · ' + esc(day.name) : ''}${i.e.note ? `<em>${esc(i.e.note)}</em>` : ''}</span>
      <span class="h-v">${esc(fmtEntry(i.e) || '—')}</span></button></li>`;
  }).join('') + `</ol>`;
  return h;
}

function chartSvg(points) {
  const W = 320, H = 130, pl = 34, pr = 10, pt = 12, pb = 22;
  const vals = points.map(p => p.e.kg);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const x = i => pl + (points.length === 1 ? 0 : i * (W - pl - pr) / (points.length - 1));
  const y = v => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
  const pts = points.map((p, i) => `${x(i).toFixed(1)},${y(p.e.kg).toFixed(1)}`).join(' ');
  const area = `${x(0).toFixed(1)},${H - pb} ${pts} ${x(points.length - 1).toFixed(1)},${H - pb}`;
  const lastI = points.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de kg">
    <line x1="${pl}" x2="${W - pr}" y1="${y(max)}" y2="${y(max)}" class="grid"/>
    <line x1="${pl}" x2="${W - pr}" y1="${y(min)}" y2="${y(min)}" class="grid"/>
    <text x="${pl - 6}" y="${y(max) + 4}" text-anchor="end" class="ax">${fmtKg(max)}</text>
    <text x="${pl - 6}" y="${y(min) + 4}" text-anchor="end" class="ax">${fmtKg(min)}</text>
    <polygon points="${area}" class="area"/>
    <polyline points="${pts}" class="line"/>
    ${points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.e.kg).toFixed(1)}" r="${i === lastI ? 5 : 3}" class="${i === lastI ? 'dot end' : 'dot'}"/>`).join('')}
    <text x="${x(0)}" y="${H - 6}" class="ax">${fmtShort(points[0].s.date)}</text>
    <text x="${x(lastI)}" y="${H - 6}" text-anchor="end" class="ax">${fmtShort(points[lastI].s.date)}</text>
  </svg>`;
}

function renderEditor() {
  setHeader('Editar rutina', 'Días y ejercicios');
  let h = '';
  for (const day of data.program.days) {
    h += `<article class="card ed-day"><header><span class="${plateClass(day)}">${esc(plateNum(day))}</span><h2>${esc(day.name)}</h2>
      <button class="link" data-act="renDay" data-id="${day.id}">Renombrar</button><button class="link danger-t" data-act="delDay" data-id="${day.id}">Borrar</button></header><ul>`;
    day.exercises.forEach((ex, i) => {
      h += `<li><div class="ed-n"><b>${esc(ex.name)}</b><span>${[ex.target, '± ' + fmtKg(ex.stepKg) + ' kg'].filter(Boolean).map(esc).join(' · ')}</span></div>
        <div class="ed-b"><button class="icon-btn sm" data-act="mv" data-day="${day.id}" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
        <button class="icon-btn sm" data-act="mv" data-day="${day.id}" data-i="${i}" data-d="1" ${i === day.exercises.length - 1 ? 'disabled' : ''} aria-label="Bajar">↓</button>
        <button class="icon-btn sm" data-act="edEx" data-day="${day.id}" data-id="${ex.id}" aria-label="Editar">✎</button>
        <button class="icon-btn sm" data-act="delEx" data-day="${day.id}" data-id="${ex.id}" aria-label="Borrar">×</button></div></li>`;
    });
    h += `</ul><button class="link" data-act="addEx" data-day="${day.id}">+ Añadir ejercicio</button></article>`;
  }
  h += `<div class="stack"><button class="btn ghost wide" data-act="addDay">+ Añadir día</button>
    <button class="btn ghost wide" data-act="resetRoutine">Restaurar la rutina original del Excel</button></div>`;
  return h;
}

  const cur = currentMon();
  const body = `<div class="opts" role="radiogroup">
      <label><input type="radio" name="rng" value="12" checked> Últimas 12 semanas</label>
      <label><input type="radio" name="rng" value="4"> Últimas 4 semanas</label>
      <label><input type="radio" name="rng" value="all"> Todas</label>
      <label><input type="radio" name="rng" value="custom"> Entre dos fechas</label>
    </div>
    <div class="two" id="custom">
      <label class="field"><span>Desde</span><input type="date" id="xFrom" value="${addDays(cur, -77)}"></label>
      <label class="field"><span>Hasta</span><input type="date" id="xTo" value="${addDays(cur, 6)}"></label>
    </div>
    <p class="hint">La hoja «Tabla» tiene el formato de tu Excel, en bloques de 4 semanas. La hoja «Datos» tiene una fila por ejercicio apuntado.</p>`;
  modal({ title: 'Exportar a Excel', body, confirm: 'Descargar Excel', onConfirm: (m) => {
    const v = m.querySelector('input[name="rng"]:checked').value;
    const end = lastMon();
    let from, to = end;
    if (v === 'all') from = firstMon();
    else if (v === 'custom') {
      const a = m.querySelector('#xFrom').value, b = m.querySelector('#xTo').value;
      if (!a || !b || a > b) { toast('Revisa las fechas: «Desde» tiene que ser anterior a «Hasta»'); return false; }
      from = mondayOf(a); to = mondayOf(b);
    } else { from = addDays(end, -7 * (Number(v) - 1)); if (from < firstMon()) from = firstMon(); }
    const weeks = weeksBetween(from, to);
    download(`RFM_GYM_${fmtShort(from).replace('/', '-')}_a_${fmtDate(addDays(to, 6)).replace(/\//g, '-')}.xlsx`,
      buildXlsx(data, weeks, { fmtEntry, fullName, mondayOf, weekLabel }), XLSX_MIME);
    toast('Excel generado');
  } });
}

// ================== Acciones ==================
function updEntry(sid, ex, patch) {
  const s = sessionById(sid); if (!s) return;
  const e = Object.assign({}, s.entries[ex.id] || {}, patch, { exerciseName: fullName(ex) });
  if (hasData(e)) s.entries[ex.id] = e; else delete s.entries[ex.id];
  save();
  const c = document.getElementById(`cheer-${ex.id}`);
  if (c) { const t = cheerText(e, lastBefore(ex.id, s)); c.textContent = t; c.hidden = !t; }
}

function startSession(dayId) {
  const day = dayById(dayId); if (!day) return;
  const date = selMon === currentMon() ? todayStr() : selMon;
  const s = { id: uid(), date, dayId, dayName: day.name, entries: {} };
  data.sessions.push(s); save();
  go({ v: 'session', id: s.id });
  if (selMon !== currentMon()) toast('Revisa la fecha del entrenamiento');
}

function exerciseForm(ex) {
  return `<label class="field"><span>Nombre</span><input id="fName" value="${esc(ex ? ex.name : '')}"></label>
    <label class="field"><span>Series/reps objetivo</span><input id="fTarget" placeholder="12x10x10" value="${esc(ex ? ex.target : '')}"></label>
    <label class="field"><span>Paso de los botones ± (kg)</span><input id="fStep" inputmode="decimal" value="${fmtKg(ex ? ex.stepKg : 2.5)}"></label>`;
}

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, v = curView();
  const exEl = b.closest('[data-ex]');
  const exId = exEl && exEl.dataset.ex;
  const sess = v.v === 'session' ? sessionById(v.id) : null;
  const exObj = exId && sess ? (dayById(sess.dayId) || { exercises: [] }).exercises.find(e => e.id === exId) : null;

  switch (a) {
    case 'wk': selMon = addDays(selMon, Number(b.dataset.d)); render(); break;
    case 'wkNow': selMon = currentMon(); render(); break;
    case 'pickWeek': selMon = b.dataset.mon; render(); break;
    case 'start': startSession(b.dataset.id); break;
    case 'open': go({ v: 'session', id: b.dataset.id }); break;
    case 'hist': go({ v: 'history', id: b.dataset.id }); break;
    case 'inc': case 'dec': {
      const f = b.dataset.f, sign = a === 'inc' ? 1 : -1;
      const input = document.getElementById(`${f}-${exId}`);
      const last = lastBefore(exId, sess);
      if (f === 'kg') {
        const base = parseKg(input.value) ?? (last && last.e.kg) ?? 0;
        const n = Math.max(0, Math.round((base + sign * exObj.stepKg) * 100) / 100);
        input.value = fmtKg(n); updEntry(sess.id, exObj, { kg: n });
      } else {
        const base = parseReps(input.value) ?? (last && last.e.reps) ?? 0;
        const n = Math.max(0, base + sign);
        input.value = n; updEntry(sess.id, exObj, { reps: n });
      }
      break;
    }
    case 'repeat': {
      const last = lastBefore(exId, sess); if (!last) break;
      const patch = {};
      if (last.e.kg != null) { patch.kg = last.e.kg; document.getElementById(`kg-${exId}`).value = fmtKg(last.e.kg); }
      if (last.e.reps != null) { patch.reps = last.e.reps; document.getElementById(`reps-${exId}`).value = last.e.reps; }
      updEntry(sess.id, exObj, patch); toast('Copiado de la última vez');
      break;
    }
    case 'note': {
      const ta = document.getElementById(`note-${exId}`);
      ta.hidden = !ta.hidden; b.textContent = ta.hidden ? 'Añadir nota' : 'Ocultar nota';
      if (ta.hidden) noteOpen.delete(sess.id + exId); else { noteOpen.add(sess.id + exId); ta.focus(); }
      break;
    }
    case 'mv': {
      const d = dayById(b.dataset.day), i = Number(b.dataset.i), j = i + Number(b.dataset.d);
      if (d && j >= 0 && j < d.exercises.length) { const [x] = d.exercises.splice(i, 1); d.exercises.splice(j, 0, x); save(); render(); }
      break;
    }
    case 'addEx': case 'edEx': {
      const d = dayById(b.dataset.day);
      const ex = a === 'edEx' ? d.exercises.find(e => e.id === b.dataset.id) : null;
      modal({ title: ex ? 'Editar ejercicio' : 'Nuevo ejercicio', body: exerciseForm(ex), confirm: 'Guardar', onConfirm: (m) => {
        const name = m.querySelector('#fName').value.trim();
        if (!name) { m.querySelector('#fName').focus(); return false; }
        const obj = { id: ex ? ex.id : uid(), name, target: m.querySelector('#fTarget').value.trim(), stepKg: parseKg(m.querySelector('#fStep').value) || 2.5 };
        if (ex) Object.assign(ex, obj); else d.exercises.push(obj);
        save(); render();
      } });
      break;
    }
    case 'delEx': {
      const d = dayById(b.dataset.day), ex = d.exercises.find(e => e.id === b.dataset.id);
      modal({ title: 'Borrar ejercicio', body: `<p>Se quitará «${esc(ex.name)}» de la rutina. Lo ya apuntado se conserva en la hoja «Datos» del Excel.</p>`, confirm: 'Borrar', danger: true,
        onConfirm: () => { d.exercises = d.exercises.filter(e => e.id !== ex.id); save(); render(); } });
      break;
    }
    case 'renDay': {
      const d = dayById(b.dataset.id);
      modal({ title: 'Nombre del día', body: `<label class="field"><span>Nombre</span><input id="fDay" value="${esc(d.name)}"></label>`, confirm: 'Guardar',
        onConfirm: (m) => { const n = m.querySelector('#fDay').value.trim(); if (!n) return false; d.name = n; save(); render(); } });
      break;
    }
    case 'delDay': {
      const d = dayById(b.dataset.id);
      modal({ title: `Borrar ${d.name}`, body: '<p>Se quitará el día y sus ejercicios de la rutina. Las sesiones hechas se conservan en la hoja «Datos».</p>', confirm: 'Borrar', danger: true,
        onConfirm: () => { data.program.days = data.program.days.filter(x => x !== d); save(); render(); } });
      break;
    }
    case 'addDay': data.program.days.push({ id: uid(), name: `Día ${data.program.days.length + 1}`, exercises: [] }); save(); render(); break;
    case 'resetRoutine':
      modal({ title: 'Restaurar rutina', body: '<p>La rutina vuelve a ser la del Excel original (4 días). Lo apuntado no se borra.</p>', confirm: 'Restaurar',
        onConfirm: () => { data.program.days = defaultDays(); save(); render(); } });
      break;
  }
});

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (!el.dataset.f) return;
  const v = curView(); if (v.v !== 'session') return;
  const sess = sessionById(v.id);
  const exId = el.closest('[data-ex]').dataset.ex;
  const ex = dayById(sess.dayId).exercises.find(e => e.id === exId);
  if (el.dataset.f === 'kg') { el.value = el.value.replace(/[^\d.,]/g, ''); updEntry(sess.id, ex, { kg: parseKg(el.value) }); }
  else if (el.dataset.f === 'reps') { el.value = el.value.replace(/\D/g, ''); updEntry(sess.id, ex, { reps: parseReps(el.value) }); }
  else if (el.dataset.f === 'note') updEntry(sess.id, ex, { note: el.value });
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'sDate' && el.value) {
    const s = sessionById(curView().id);
    s.date = el.value; save(); selMon = mondayOf(el.value); render();
  } else if (el.id === 'importFile' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = normalize(JSON.parse(r.result));
        modal({ title: 'Restaurar copia', body: `<p>Se sustituirán los datos actuales por los de la copia (${d.sessions.length} entrenamientos).</p>`, confirm: 'Restaurar', danger: true,
          onConfirm: () => { data = d; save(); nav.length = 1; selMon = currentMon(); render(true); toast('Copia restaurada'); } });
      } catch (e) { toast('Ese archivo no es una copia de RFM GYM'); }
      el.value = '';
    };
    r.readAsText(el.files[0]);
  }
});

$('#back').addEventListener('click', back);
$('#menuBtn').addEventListener('click', () => { const m = $('#menu'); m.hidden = !m.hidden; });
$('#delSession').addEventListener('click', () => {
  const s = sessionById(curView().id);
  modal({ title: 'Borrar entrenamiento', body: `<p>Se borrará lo apuntado el ${fmtLong(s.date)}.</p>`, confirm: 'Borrar', danger: true,
    onConfirm: () => { data.sessions = data.sessions.filter(x => x.id !== s.id); save(); back(); } });
});
$('#menu').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-menu]'); if (!b) return;
  $('#menu').hidden = true;
  const today = todayStr();
  if (b.dataset.menu === 'editor') go({ v: 'editor' });
  else if (b.dataset.menu === 'xlsx') exportDialog();
  else if (b.dataset.menu === 'backup') { download(`RFM_GYM_copia_${today}.json`, JSON.stringify(data, null, 1), 'application/json'); toast('Copia generada'); }
  else if (b.dataset.menu === 'import') $('#importFile').click();
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { $('#modal').hidden = true; $('#menu').hidden = true; } });

render();

document.addEventListener('click', (ev) => {
  if (!ev.target.closest('#menu') && !ev.target.closest('#menuBtn')) document.getElementById('menu').hidden = true;
}, true);
</script>

<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
